services:
  app:
    build: .
    container_name: bigbuller_app
    volumes:
      - .:/app
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: bigbuller_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: bigbuller_db
    environment:
      MYSQL_DATABASE: bigbuller
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - laravel

networks:
  laravel:

